name: Sin emojis

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  sin-emojis:
    name: sin-emojis
    runs-on: ubuntu-latest
    steps:
      - name: Buscar emojis en titulo, descripcion y commits
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          emoji = re.compile("[\U0001F000-\U0001FAFF\u2600-\u26FF\u2705\u2728\u274C\u274E\u2753-\u2755\u2757\u2764\u2795-\u2797\u27A1\u27B0\u27BF\u2B50\u2B55\uFE0F\u200D]")
          evento = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          es_pr = os.environ["EVENT_NAME"] == "pull_request"
          obj = evento["pull_request"] if es_pr else evento["issue"]

          textos = {"titulo": obj.get("title") or "", "descripcion": obj.get("body") or ""}
          if es_pr:
              salida = subprocess.run(
                  ["gh", "api", "--paginate",
                   f"repos/{os.environ['REPO']}/pulls/{obj['number']}/commits",
                   "--jq", ".[].commit.message | gsub(\"\\n\"; \" \")"],
                  capture_output=True, text=True, check=True).stdout
              for i, msg in enumerate(salida.splitlines(), 1):
                  textos[f"commit {i}"] = msg

          fallos = [k for k, v in textos.items() if emoji.search(v)]
          if not fallos:
              print("Sin emojis.")
              sys.exit(0)

          print("Se encontraron emojis en: " + ", ".join(fallos))
          if not es_pr:
              aviso = ("Este issue contiene emojis en: " + ", ".join(fallos) +
                       ". Por favor quitalos (acuerdo del equipo en CONTRIBUTING.md).")
              subprocess.run(["gh", "issue", "comment", str(obj["number"]),
                              "--repo", os.environ["REPO"], "--body", aviso], check=False)
          sys.exit(1)
          PY